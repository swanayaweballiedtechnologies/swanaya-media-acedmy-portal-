    <script>
      (function () {
        try {
          var saved = localStorage.getItem('sma_theme');
          var cachedCfgRaw = localStorage.getItem('sma_theme_config_v1');
          var cachedCfg = cachedCfgRaw ? JSON.parse(cachedCfgRaw) : null;
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = (saved === 'light' || saved === 'dark')
            ? saved
            : (cachedCfg && (cachedCfg.defaultMode === 'light' || cachedCfg.defaultMode === 'dark'))
              ? cachedCfg.defaultMode
              : (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          document.documentElement.dataset.theme = theme;
          if (cachedCfg && cachedCfg.palette) {
            var p = cachedCfg.palette;
            var s = document.documentElement.style;
            if (p.primary) s.setProperty('--sma-primary', p.primary);
            if (p.secondary) s.setProperty('--sma-secondary', p.secondary);
            if (p.accent) s.setProperty('--sma-accent', p.accent);
            if (p.background) s.setProperty('--sma-bg', p.background);
            if (p.surface) s.setProperty('--sma-surface', p.surface);
            if (p.textPrimary) s.setProperty('--sma-text-primary', p.textPrimary);
            if (p.textSecondary) s.setProperty('--sma-text-secondary', p.textSecondary);
            if (p.border) s.setProperty('--sma-border', p.border);
            if (p.darkBackground) s.setProperty('--sma-dark-bg', p.darkBackground);
            if (p.darkSurface) s.setProperty('--sma-dark-surface', p.darkSurface);
          }
        } catch (e) {}
      })();
    </script>
